<!doctype html>
<html lang="ka">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>ASTRAL 🪐 — Druggy Theme</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Rubik:wght@300;700&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg-img: url('/mnt/data/1c901687-c034-453c-89a9-819137c60bd9.png');
      --c1: #ff5bff; /* neon pink */
      --c2: #7ef9ff; /* cyan */
      --c3: #b388ff; /* purple */
      --c4: #ffd07e; /* warm */
      --glass: rgba(255,255,255,0.06);
    }
    *{box-sizing:border-box}
    html,body{height:100%;margin:0;font-family:Rubik, Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;}

    body{
      background-color:#070014;
      background-image: linear-gradient(135deg, rgba(22,6,48,0.8), rgba(6,12,36,0.9)), var(--bg-img);
      background-size: cover; background-position: center; background-repeat:no-repeat;
      overflow:hidden; color:white; -webkit-font-smoothing:antialiased;
    }

    .color-overlay{
      position:fixed; inset:0; pointer-events:none; z-index:0;
      background: radial-gradient(600px 300px at 10% 20%, rgba(255,91,255,0.08), transparent 10%),
                  radial-gradient(500px 300px at 85% 80%, rgba(126,249,255,0.06), transparent 12%),
                  radial-gradient(400px 200px at 45% 50%, rgba(179,136,255,0.06), transparent 10%);
      mix-blend-mode: screen;
    }

    .stage{position:relative; z-index:2; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:40px;}
    .card{width:min(1100px, 96%); display:grid; grid-template-columns: 1fr 420px; gap:24px; align-items:center;}

    .hero{
      padding:32px; border-radius:18px; backdrop-filter: blur(8px) saturate(120%); background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(0,0,0,0.06));
      box-shadow: 0 20px 60px rgba(3,4,20,0.6), inset 0 1px 0 rgba(255,255,255,0.02);
    }

    .title{
      font-family: 'Orbitron', sans-serif; font-weight:700; letter-spacing:0.02em;
      font-size: clamp(48px, 8vw, 120px); line-height:0.9; margin:0 0 12px 0; color:transparent; position:relative;
      -webkit-background-clip:text; background-clip:text;
      background-image: linear-gradient(90deg, var(--c1), var(--c2), var(--c3), var(--c4));
      text-shadow: 0 6px 30px rgba(120,0,120,0.35), 0 2px 10px rgba(0,0,0,0.6);
    }

    .title .emoji{display:inline-block; margin-left:10px; transform:translateY(-4px); filter:drop-shadow(0 6px 18px rgba(0,0,0,0.5));}

    .subtitle{font-size:16px; margin:6px 0 18px 0; color:rgba(255,255,255,0.85)}

    .controls{display:flex; gap:12px; align-items:center;}
    .btn{
      font-weight:700; padding:14px 20px; border-radius:14px; cursor:pointer; border:1px solid rgba(255,255,255,0.08);
      background:linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0.01)); color:white; letter-spacing:0.06em;
      box-shadow:0 8px 30px rgba(0,0,0,0.6), 0 0 18px rgba(0,0,0,0.2);
      transition: transform .18s ease, box-shadow .18s ease;
      position:relative; overflow:hidden; text-decoration:none; display:inline-flex; align-items:center; justify-content:center;
    }
    .btn:before{content:""; position:absolute; inset:0; background:radial-gradient(circle at 10% 10%, rgba(255,255,255,0.06), transparent 30%); mix-blend-mode:overlay; pointer-events:none}

    .btn--neon{
      background: linear-gradient(90deg, rgba(255,91,255,0.12), rgba(126,249,255,0.06));
      border: 1px solid rgba(255,255,255,0.12);
      box-shadow: 0 8px 40px rgba(126,10,140,0.18), 0 0 28px rgba(126,249,255,0.08);
    }
    .btn--neon:hover{ transform:translateY(-6px) scale(1.02); box-shadow: 0 18px 60px rgba(126,10,140,0.22), 0 0 36px rgba(126,249,255,0.12); }

    .btn--ghost{ background:transparent; border:1px solid rgba(255,255,255,0.06); color:rgba(255,255,255,0.92)}

    .panel{padding:22px; border-radius:18px; min-height:320px; display:flex; flex-direction:column; gap:12px; align-items:center; justify-content:center;
      background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(0,0,0,0.06)); border:1px solid rgba(255,255,255,0.04);
    }
    .panel .badge{font-weight:700; padding:8px 14px; border-radius:999px; background:linear-gradient(90deg,var(--c2),var(--c3)); color:#071028}

    .shard{position:absolute; width:220px; height:220px; transform:translateZ(0); filter:blur(0.6px); opacity:0.12}
    .shard.s1{right:-40px; top:10%; background:linear-gradient(45deg, rgba(255,91,255,0.18), rgba(126,249,255,0.12)); clip-path:polygon(50% 0,100% 35%,80% 100%,20% 100%,0 35%);}
    .shard.s2{left:-60px; bottom:8%; width:260px; height:260px; background:linear-gradient(45deg, rgba(179,136,255,0.12), rgba(255,208,126,0.06)); clip-path:polygon(50% 0,100% 30%,88% 100%,12% 100%,0 30%);}

    canvas#floaters{position:fixed; inset:0; width:100%; height:100%; z-index:1; pointer-events:none}

    @media (max-width:880px){ .card{grid-template-columns:1fr; } .panel{order:-1} }
  </style>
</head>
<body>
  <div class="color-overlay" aria-hidden="true"></div>
  <canvas id="floaters" aria-hidden="true"></canvas>

  <main class="stage" role="main">
    <div class="card" role="region" aria-label="ASTRAL showcase">

      <section class="hero" aria-labelledby="title">
        <h1 id="title" class="title">ASTRAL <span class="emoji">🪐</span></h1>
        <p class="subtitle">ფერადი, ზღაპრული ექსპერიმენტი — ფერები პირდაპირ მომავლიდან, დააჭირეთ ქვევით მოცემულ ღილაკებს ნავიგაციისთვის. 🚀</p>

        <div class="controls" role="toolbar" aria-label="primary actions">
          <a id="shopBtn" class="btn btn--neon" href="https://t.me/AstralMainBot" target="_blank" rel="noopener">SHOP</a>
          <a id="channelBtn" class="btn btn--ghost" href="https://t.me/astralurimagazia" target="_blank" rel="noopener">CHANNEL</a>
          <a id="roulleteBtn" class="btn" href="https://t.me/grptlkch" target="_blank" rel="noopener">ROULLETE</a>
        </div>

      </section>

      <aside class="panel" aria-label="decorative panel">
        <div style="display:flex;flex-direction:column;align-items:center;gap:12px">
          <div class="badge">ASTRAL SHOP</div>
          <div style="font-weight:700; font-size:20px">კოსმოსური პროდუქტები &amp; კოსმოსური ვაიბები ✨</div>
          <div style="max-width:260px; text-align:center; color:rgba(255,255,255,0.82)">საუკეთესო პროდუქტი საქართველოში, პირდაპირ კოსმოსიდან. 🌌</div>
        </div>
      </aside>

      <div class="shard s1" aria-hidden="true"></div>
      <div class="shard s2" aria-hidden="true"></div>
    </div>
  </main>

  <script>
    // Floaters canvas
    const canvas = document.getElementById('floaters');
    const ctx = canvas.getContext('2d');
    let W = canvas.width = innerWidth;
    let H = canvas.height = innerHeight;
    const TAU = Math.PI*2;

    function rand(min,max){return Math.random()*(max-min)+min}

    let huePalette = [300, 185, 265, 40];
    const particles = [];
    const PCOUNT = Math.round((W*H)/50000);
    for(let i=0;i<Math.max(28, PCOUNT); i++){
      particles.push({
        x: rand(0,W), y: rand(-H, H), r: rand(2,12), life: rand(80,420), maxLife: rand(200,600),
        vx: rand(-0.3,0.6), vy: rand(0.2,1.2), hue: huePalette[Math.floor(rand(0,huePalette.length))], alpha: rand(0.18,0.9), shape: Math.random()<0.3 ? 'blob' : 'snow'
      })
    }

    function onResize(){ W = canvas.width = innerWidth; H = canvas.height = innerHeight; }
    window.addEventListener('resize', onResize);

    function draw(){
      ctx.clearRect(0,0,W,H);
      for(let p of particles){
        p.x += p.vx; p.y += p.vy; p.life -= 1;
        if(p.y > H + 40 || p.x < -60 || p.x > W + 60 || p.life <= 0){
          p.x = rand(-60,W+60); p.y = rand(-H, -10); p.life = p.maxLife = rand(180,640); p.vx = rand(-0.4,0.8); p.vy = rand(0.2,1.2);
          p.hue = huePalette[Math.floor(rand(0,huePalette.length))]; p.alpha = rand(0.18,0.95); p.r = rand(2,12);
        }

        if(p.shape === 'blob'){
          const grd = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r*8);
          grd.addColorStop(0, `hsla(${p.hue},90%,65%,${p.alpha})`);
          grd.addColorStop(0.35, `hsla(${p.hue},85%,55%,${p.alpha*0.35})`);
          grd.addColorStop(1, `hsla(${p.hue},85%,35%,0)`);
          ctx.fillStyle = grd; ctx.arc(p.x,p.y,p.r*4,0,TAU); ctx.fill();
        } else {
          ctx.fillStyle = `hsla(${p.hue},90%,70%,${p.alpha})`;
          ctx.shadowColor = `hsla(${p.hue},90%,65%,${p.alpha})`;
          ctx.shadowBlur = Math.max(8, p.r*2);
          ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,TAU); ctx.fill();
          ctx.shadowBlur = 0;
        }
      }
      requestAnimationFrame(draw);
    }

    draw();

    // Buttons
    const shopBtn = document.getElementById('shopBtn');
    const channelBtn = document.getElementById('channelBtn');
    const roulleteBtn = document.getElementById('roulleteBtn');
    const title = document.getElementById('title');

    function pulseTitle(hues){
      const g = `linear-gradient(90deg, hsl(${hues[0]},90%,65%), hsl(${hues[1]},90%,65%), hsl(${hues[2]},85%,66%), hsl(${hues[3]},92%,70%))`;
      title.style.backgroundImage = g;
      title.animate([{transform:'translateY(0px)'},{transform:'translateY(-6px)'},{transform:'translateY(0px)'}], {duration:800, iterations:1});
    }

    function openAndBurst(url, opts={}){
      // visual burst
      for(let i=0;i<(opts.count||12);i++) particles.push({x: opts.x||innerWidth*0.5 + rand(-80,80), y: opts.y||innerHeight*0.5 + rand(-80,80), r: rand(3,14), life: rand(80,220), maxLife: rand(80,220), vx: rand(opts.vxMin||-1, opts.vxMax||6), vy: rand(opts.vyMin||-1.6, opts.vyMax||1.6), hue: Math.floor(rand(260,320)), alpha: rand(0.6,1), shape:'blob'});
      // pulse title
      pulseTitle([Math.floor(rand(0,360)), Math.floor(rand(0,360)), Math.floor(rand(0,360)), Math.floor(rand(0,360))]);
      // open link
      if(url) window.open(url, '_blank', 'noopener');
    }

    shopBtn.addEventListener('click', (e)=>{ e.preventDefault(); openAndBurst('https://t.me/AstralMainBot', {x: innerWidth*0.3, y: innerHeight*0.5, count:16}); });
    channelBtn.addEventListener('click', (e)=>{ e.preventDefault(); openAndBurst('https://t.me/astralurimagazia', {x: innerWidth*0.75, y: innerHeight*0.45, count:10}); });
    roulleteBtn.addEventListener('click', (e)=>{ e.preventDefault(); huePalette = [Math.floor(rand(0,360)), Math.floor(rand(0,360)), Math.floor(rand(0,360)), Math.floor(rand(0,360))]; for(let p of particles) p.hue = huePalette[Math.floor(rand(0,huePalette.length))]; openAndBurst('https://t.me/grptlkch', {x: innerWidth*0.5, y: innerHeight*0.35, count:12}); });

    const shards = document.querySelectorAll('.shard');
    let t0 = performance.now();
    function shardLoop(now){
      const dt = (now - t0)/1000; t0 = now;
      shards.forEach((s,i)=>{
        const rot = Math.sin(now/2000 + i)*6; s.style.transform = `rotate(${rot}deg)`;
      });
      requestAnimationFrame(shardLoop);
    }
    requestAnimationFrame(shardLoop);
  </script>
</body>
</html>
