<!--
Astral Text Website - single-file HTML
Save this as `index.html` and open in a browser to view.

Features:
- Full-screen animated starfield using canvas
- Centered, animated "astral" text with gradient + glow
- Click the text to edit it in-place (or use the input below)
- Responsive and lightweight

If you'd like a different word, color scheme, or extra effects (nebula, particles that react to clicks), tell me and I'll update it.
-->

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Astral — Text Demo</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Inter:wght@300;600&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg1: #030411;
      --bg2: #071029;
      --accent-1: #7ef9ff;
      --accent-2: #b388ff;
      --accent-3: #ffd07e;
    }
    html,body{height:100%;margin:0;font-family:Inter, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial}
    body{
      background: radial-gradient(ellipse at 10% 10%, rgba(20,30,60,0.3), transparent 10%), linear-gradient(180deg,var(--bg1), var(--bg2));
      color: white; overflow:hidden; -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale;
    }

    /* Fullscreen canvas for starfield */
    canvas#stars{
      position:fixed; inset:0; width:100%; height:100%; display:block; z-index:0;
    }

    /* Center UI */
    .stage{
      position:relative; z-index:2; height:100vh; display:flex; align-items:center; justify-content:center; flex-direction:column; gap:20px; text-align:center; padding:40px;
    }

    /* The big astral text */
    .astral-text{
      font-family: 'Orbitron', sans-serif; font-weight:700; font-size:clamp(48px, 14vw, 180px);
      letter-spacing:0.03em; line-height:0.9; cursor:pointer; user-select:none; position:relative;
      background: linear-gradient(90deg, var(--accent-1), var(--accent-2), var(--accent-3));
      -webkit-background-clip:text; background-clip:text; color:transparent;
      filter: drop-shadow(0 10px 30px rgba(0,0,0,0.6));
    }

    /* outer glow */
    .astral-text::after{
      content:""; position:absolute; inset:0; z-index:-1; filter:blur(28px) saturate(140%);
      background: linear-gradient(90deg, rgba(126,249,255,0.2), rgba(179,136,255,0.18), rgba(255,208,126,0.12));
      opacity:0.9; mix-blend-mode:screen; border-radius:12px;
    }

    /* subtle shimmer animation */
    @keyframes shimmer{ 0%{transform:translateX(-30%)} 100%{transform:translateX(130%)} }
    .astral-text .shimmer{
      position:absolute; inset:0; pointer-events:none; background:linear-gradient(90deg, rgba(255,255,255,0.08), rgba(255,255,255,0.18), rgba(255,255,255,0.03)); transform:translateX(-30%); animation:shimmer 6s linear infinite;
      -webkit-background-clip:text; background-clip:text; color:transparent;
    }

    /* small controls */
    .controls{display:flex; gap:8px; align-items:center; justify-content:center; margin-top:8px;}
    input[type=text]{padding:8px 12px; border-radius:8px; border:1px solid rgba(255,255,255,0.08); background:rgba(255,255,255,0.02); color:white; outline:none; min-width:180px}
    button{padding:8px 12px; border-radius:8px; border:1px solid rgba(255,255,255,0.08); background:linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0.01)); color:white; cursor:pointer}
    .muted{opacity:0.7;font-size:13px}

    footer{position:fixed; right:12px; bottom:12px; z-index:3; font-size:12px; color:rgba(255,255,255,0.6)}

    /* Responsive tweaks */
    @media (max-width:520px){ .controls{flex-direction:column} }
  </style>
</head>
<body>
  <canvas id="stars" aria-hidden="true"></canvas>

  <main class="stage" role="main">
    <div style="position:relative;">
      <div id="astral" class="astral-text" title="Click to edit">astral
        <div class="shimmer" aria-hidden="true">astral</div>
      </div>
    </div>

    <div class="controls" aria-label="controls">
      <label class="muted" for="textInput">Change text:</label>
      <input id="textInput" type="text" value="astral" aria-label="text input">
      <button id="applyBtn">Apply</button>
      <button id="randomBtn">Random</button>
    </div>

    <p class="muted">Tip: click the big word or edit the input above.</p>
  </main>

  <footer>Made with ✨ — single-file demo</footer>

  <script>
    // STARFIELD CANVAS
    const canvas = document.getElementById('stars');
    const ctx = canvas.getContext('2d');
    let W = canvas.width = innerWidth;
    let H = canvas.height = innerHeight;
    const TAU = Math.PI * 2;

    // create stars
    const numStars = Math.round((W * H) / 8000); // density scales with area
    const stars = [];

    function rand(min, max){ return Math.random() * (max - min) + min }

    function makeStar(){
      return {
        x: rand(0, W), y: rand(0, H),
        r: rand(0.25, 1.8),
        alpha: rand(0.02, 0.9),
        twinkleSpeed: rand(0.002, 0.02),
        vx: rand(-0.02, 0.02),
        vy: rand(-0.02, 0.02)
      }
    }

    for(let i=0;i<numStars;i++) stars.push(makeStar());

    window.addEventListener('resize', ()=>{
      W = canvas.width = innerWidth; H = canvas.height = innerHeight;
      // repopulate a bit if needed
      while(stars.length < Math.round((W * H) / 8000)) stars.push(makeStar());
    });

    // mouse parallax
    const mouse = {x: W/2, y: H/2};
    window.addEventListener('mousemove', e=>{ mouse.x = e.clientX; mouse.y = e.clientY });

    function draw(){
      ctx.clearRect(0,0,W,H);

      // subtle gradient overlay
      const g = ctx.createLinearGradient(0,0,0,H);
      g.addColorStop(0,'rgba(10,18,35,0.08)');
      g.addColorStop(1,'rgba(2,6,12,0.12)');
      ctx.fillStyle = g; ctx.fillRect(0,0,W,H);

      for(let s of stars){
        // twinkle
        s.alpha += Math.sin(performance.now() * s.twinkleSpeed) * 0.002;
        if(s.alpha < 0.02) s.alpha = 0.02;
        if(s.alpha > 1) s.alpha = 1;

        // parallax offset from center based on mouse
        const dx = (s.x - mouse.x) * 0.0006;
        const dy = (s.y - mouse.y) * 0.0006;

        ctx.beginPath();
        ctx.fillStyle = 'rgba(255,255,255,' + (s.alpha * 0.9) + ')';
        ctx.arc(s.x + dx*200, s.y + dy*200, s.r, 0, TAU);
        ctx.fill();
      }

      // occasional shooting star effect
      if(Math.random() < 0.003){ spawnShootingStar() }

      // draw shooting stars
      for(let i = shootingStars.length-1; i>=0; i--){
        const ss = shootingStars[i];
        ss.x += ss.vx; ss.y += ss.vy; ss.life -= 1;
        ctx.beginPath(); ctx.moveTo(ss.x, ss.y);
        ctx.lineTo(ss.x - ss.vx*6, ss.y - ss.vy*6);
        ctx.strokeStyle = 'rgba(255,255,255,' + (ss.life/ss.maxLife) + ')';
        ctx.lineWidth = 1.5; ctx.stroke();
        if(ss.life <= 0) shootingStars.splice(i,1);
      }

      requestAnimationFrame(draw);
    }

    // shooting stars container
    const shootingStars = [];
    function spawnShootingStar(){
      shootingStars.push({ x: rand(0, W), y: rand(0, H/3), vx: rand(6, 12), vy: rand(1,3), life: 30, maxLife:30 });
    }

    draw();

    // TEXT INTERACTION
    const astral = document.getElementById('astral');
    const input = document.getElementById('textInput');
    const applyBtn = document.getElementById('applyBtn');
    const randomBtn = document.getElementById('randomBtn');

    function setText(t){
      const sanitized = String(t).slice(0,40);
      astral.childNodes[0].nodeValue = sanitized; // change text node
      // update shimmer to match
      const shimmer = astral.querySelector('.shimmer');
      shimmer.textContent = sanitized;
    }

    applyBtn.addEventListener('click', ()=> setText(input.value || 'astral'));
    input.addEventListener('keydown', e=>{ if(e.key === 'Enter') setText(input.value || 'astral') });

    astral.addEventListener('click', ()=>{
      // inline edit: focus input
      input.focus(); input.select();
    });

    randomBtn.addEventListener('click', ()=>{
      const samples = ['astral','nebula','cosmic','lumen','astrum','stellar','aurora','void','polaris','eclipse'];
      const pick = samples[Math.floor(Math.random()*samples.length)]; setText(pick); input.value = pick;
    });

    // initial text
    setText('astral');
  </script>
</body>
</html>
